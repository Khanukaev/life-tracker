name: CI

on:
  push:
    branches: [main, develop]
    tags: ["v*"]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend · lint, types, tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17.6-alpine
        env:
          POSTGRES_USER: tracker
          POSTGRES_PASSWORD: tracker
          POSTGRES_DB: tracker
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U tracker"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql+asyncpg://tracker:tracker@localhost:5432/tracker_test
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.13.9"
          enable-cache: true
      - run: uv python install  # version from .python-version
      - run: uv sync --locked
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Golden expectations come from the original JS
        run: |
          python3 golden/make_fixtures.py
          node golden/run-legacy.mjs --check
          git diff --exit-code golden/fixtures
      - name: Ruff
        run: |
          uv run ruff check .
          uv run ruff format --check .
      - name: Mypy
        run: uv run mypy backend/lifetracker bot/lifetracker_bot mcp/lifetracker_mcp
      - name: Migrations match models
        working-directory: backend
        env:
          DATABASE_URL: postgresql+asyncpg://tracker:tracker@localhost:5432/tracker
          JWT_SECRET: ci-only-secret-ci-only-secret-0000
        run: |
          uv run alembic upgrade head
          uv run alembic check
      - name: Pytest (API, isolation, golden Python vs JS)
        run: uv run pytest -q

  miniapp:
    name: Mini App · types, tests, bundle budget, Lighthouse
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: miniapp
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 12.16.1
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: miniapp/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: Client formulas vs golden expectations (vitest)
        run: pnpm test
      - name: Typecheck + build
        run: pnpm build
      - name: Bundle budget (< 100 KB gzip)
        run: pnpm size
      - name: Lighthouse (mobile)
        run: npx -y @lhci/cli@0.15.1 autorun

  images:
    name: Docker images
    needs: [backend, miniapp]
    runs-on: ubuntu-latest
    env:
      # Images are pushed only when Docker Hub credentials are configured in repo secrets.
      PUSH: ${{ github.event_name == 'push' && secrets.DOCKERHUB_TOKEN != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Log in to Docker Hub
        if: env.PUSH == 'true'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: andreymaxim/lifetracker-backend
          tags: |
            type=sha
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
      - name: Build backend (push on main and tags)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: backend/Dockerfile
          push: ${{ env.PUSH == 'true' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - id: meta_miniapp
        uses: docker/metadata-action@v5
        with:
          images: andreymaxim/lifetracker-miniapp
          tags: |
            type=sha
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
      - name: Build Mini App (push on main and tags)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: miniapp/Dockerfile
          push: ${{ env.PUSH == 'true' }}
          tags: ${{ steps.meta_miniapp.outputs.tags }}
          labels: ${{ steps.meta_miniapp.outputs.labels }}
          cache-from: type=gha,scope=miniapp
          cache-to: type=gha,mode=max,scope=miniapp
