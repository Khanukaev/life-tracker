[tool.uv.workspace]
members = ["backend", "bot"]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "mypy>=2.4.1",
    "pytest>=9.2.0",
    "pytest-asyncio>=1.5.0",
    "ruff>=0.17.6",
]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["backend/alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "ASYNC", "RUF", "N", "S", "PT"]
ignore = ["RUF001", "RUF002", "RUF003"]  # Cyrillic text in user-facing strings is intentional

[tool.ruff.lint.isort]
known-first-party = ["lifetracker", "lifetracker_bot"]
known-third-party = ["alembic"]

[tool.ruff.lint.per-file-ignores]
"**/tests/**" = ["S101", "S105", "S106"]
"golden/*.py" = ["E501", "S311"]  # test-data generator
"backend/scripts/*.py" = ["E501", "S311", "S101"]  # dev benchmarks

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
exclude = ["alembic/versions/"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["backend/tests", "bot/tests"]
markers = ["nodb: pure tests that do not need PostgreSQL"]
