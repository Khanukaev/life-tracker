[project]
name = "lifetracker-mcp"
version = "0.1.0"
description = "Life Tracker remote MCP server (Streamable HTTP): each user's Claude reads and updates their own tracker"
requires-python = ">=3.12,<3.13"
dependencies = [
    "lifetracker",
    "mcp>=2.3.0",
]

[tool.uv.sources]
lifetracker = { workspace = true }

[build-system]
requires = ["uv_build>=0.9,<0.14"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-root = ""
