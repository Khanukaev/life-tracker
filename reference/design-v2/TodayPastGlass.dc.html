<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":880}}'>
class Component extends DCLogic {
  constructor(p) { super(p); this.state = { habitsOpen: false, tasksOpen: false }; }
  renderVals() {
    const H = [
      { kind: 'auto', title: 'Отбой до 00:30', meta: 'прошлая ночь, лёг в 00:50', regular: true, result: 'miss' },
      { kind: 'check', title: 'Зарядка 10 минут', meta: 'каждый день', regular: true, step: 1 },
      { kind: 'count', title: 'Вода', total: 8, per: 1, unit: '', step: 6, regular: true },
      { kind: 'count', title: 'Английский', total: 4, per: 5, unit: 'мин', step: 4, regular: true },
      { kind: 'check', title: 'Витамины', meta: 'каждый день', regular: true, step: 1 },
    ];
    const T = [
      { kind: 'check', title: 'Позвонить в деканат', meta: 'понедельник', step: 1 },
      { kind: 'check', title: 'Выучить 15 слов из урока 12', meta: 'английский, урок 12', step: 0 },
      { kind: 'check', title: 'Купить кроссовки', meta: 'без даты', step: 0 }
    ];
    const isDone = (x) => x.kind === 'auto' ? !!x.result : (x.step || 0) >= (x.kind === 'count' ? x.total : 1);
    const out = {};
    const make = (key, L) => {
      const open = L.filter((x) => !isDone(x)), closed = L.filter(isDone), on = this.state[key + 'Open'];
      out[key] = (on ? open.concat(closed) : open).map((x, i) => ({ ...x, first: i === 0 }));
      out[key + 'Cnt'] = L.filter((x) => isDone(x) && x.result !== 'miss').length + ' из ' + L.length;
      out[key + 'HasDone'] = closed.length > 0;
      out[key + 'Open'] = on;
      out[key + 'DoneLabel'] = open.length ? 'Отмечено · ' + closed.length : 'Всё отмечено · ' + closed.length;
      out[key + 'Btn'] = on ? 'Скрыть' : 'Показать';
      out[key + 'Rot'] = on ? 180 : 0;
      out[key + 'FoldBorder'] = (open.length || on) ? '1px solid rgba(255,255,255,0.09)' : 'none';
      out[key + 'Toggle'] = () => this.setState({ [key + 'Open']: !on });
    };
    make('habits', H); make('tasks', T);
    return out;
  }
}
</script>
