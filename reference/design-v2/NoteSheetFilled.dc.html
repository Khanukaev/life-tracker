<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Glass · Заметка о неделе, заполнено</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0;background:#000}
*{box-sizing:border-box}
.n{font-variant-numeric:tabular-nums;font-feature-settings:"tnum"}
.ic{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;flex:none}
.card{position:relative;border-radius:24px;background:rgba(255,255,255,0.06);border:1px solid rgba(255,255,255,0.09);box-shadow:inset 0 1px 0 rgba(255,255,255,0.12)}
.tile{display:flex;flex-direction:column;justify-content:space-between;height:148px;padding:14px 16px 16px;text-decoration:none;color:#f5f5f7}
.tl{display:flex;justify-content:space-between;align-items:center;font-size:15px;line-height:20px;color:#d1d1d6}
.tv{font-size:30px;line-height:34px;font-weight:600;letter-spacing:-0.03em}
.tv small{font-size:15px;font-weight:500;color:#8e8e93;letter-spacing:0;margin-left:2px}
.lab{font-size:15px;line-height:20px;color:#d1d1d6}
.lead{margin:0;font-size:17px;line-height:24px;color:#d1d1d6;max-width:340px}
.lead b{color:#f5f5f7;font-weight:600}
.cap{font-size:13px;line-height:18px;color:#8e8e93}
.h2{margin:0;font-size:17px;line-height:22px;font-weight:600}
.stat{flex:1;display:flex;flex-direction:column;gap:2px;padding:14px 18px}
.stat+.stat{border-left:1px solid rgba(255,255,255,0.09)}
.stat b{font-size:20px;line-height:24px;font-weight:600;letter-spacing:-0.02em}
.lr{display:flex;align-items:center;gap:12px;min-height:56px;padding:8px 16px 8px 18px;text-decoration:none;color:#f5f5f7}
.lr+.lr{border-top:1px solid rgba(255,255,255,0.09)}
.seg{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:2px;padding:2px;border-radius:999px;background:rgba(255,255,255,0.08);height:44px;width:168px}
.seg button{appearance:none;border:0;font:inherit;font-size:14px;font-weight:500;border-radius:999px;background:transparent;color:#aeaeb2;cursor:pointer}
.seg button.on{background:rgba(255,255,255,0.18);color:#f5f5f7}
.clogo{display:inline-block;flex:none;width:20px;height:20px;border-radius:6px;border:1.5px dashed rgba(255,255,255,0.45)}
.pill{display:inline-flex;align-items:center;height:24px;padding:0 9px;border-radius:999px;background:rgba(47,86,176,0.35);color:#d7e0f7;font-size:12px;font-weight:500}
.sum{display:flex;flex-direction:column;gap:10px;padding:18px 18px;border-radius:24px;border:1px solid transparent;background:linear-gradient(#0a0a0d,#0a0a0d) padding-box,linear-gradient(120deg,rgba(160,130,255,0.95) 0%,rgba(160,130,255,0.25) 35%,rgba(110,140,255,0.25) 65%,rgba(110,140,255,0.95) 100%) border-box;box-shadow:-34px -26px 70px -18px rgba(140,105,255,0.45),34px 30px 70px -18px rgba(84,120,255,0.55)}
.src{display:flex;align-items:center;gap:6px;font-size:13px;line-height:18px;color:#8e8e93}
.sum p{margin:0;font-size:16px;line-height:22px;color:#d1d1d6}
.sum b{color:#f5f5f7;font-weight:600}
.motto{margin:0;font-size:18px;line-height:25px;font-weight:400;color:#f5f5f7;letter-spacing:-0.015em}
.row3{display:flex;align-items:center;gap:14px;min-height:84px;padding:12px 16px 12px 18px;text-decoration:none;color:#f5f5f7}
.chip{appearance:none;border:0;font:inherit;font-size:14px;font-weight:500;height:36px;padding:0 12px;border-radius:999px;cursor:pointer;white-space:nowrap}
.ta{width:100%;min-height:84px;resize:none;border-radius:14px;border:1px solid rgba(255,255,255,0.10);background:rgba(255,255,255,0.05);color:#f5f5f7;font:inherit;font-size:16px;line-height:22px;padding:12px 14px;outline:none}
.ta::placeholder{color:#636366}
.qlab{display:block;font-size:17px;line-height:22px;font-weight:600;margin:0 0 10px}
.sw{position:relative;width:51px;height:31px;border-radius:999px;flex:none;border:0;padding:0;cursor:pointer}
.sw i{position:absolute;top:2px;width:27px;height:27px;border-radius:50%;background:#fff;box-shadow:0 2px 6px rgba(0,0,0,0.3)}
.cp{appearance:none;border:0;background:transparent;font:inherit;color:#f5f5f7;cursor:pointer;width:100%;text-align:left;display:flex;align-items:center;gap:12px;min-height:60px;padding:10px 16px 10px 18px}
.cp+.cp{border-top:1px solid rgba(255,255,255,0.09)}
.tab{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;height:56px;text-decoration:none;font-size:11px;font-weight:500;color:#aeaeb2}
a:focus-visible,button:focus-visible{outline:2px solid #f5f5f7;outline-offset:2px}
.todo{outline:1.5px dashed #2f56b0;outline-offset:3px}
</style>
</helmet>
<div style="width: 390px; height: 844px; background: #000; color: #f5f5f7; font-family: Geist, -apple-system, system-ui, sans-serif; -webkit-font-smoothing: antialiased; letter-spacing: -0.01em; position: relative; overflow: hidden">
<div aria-hidden="true" style="position: absolute; left: 0; right: 0; top: 0; height: 560px; pointer-events: none; background: radial-gradient(520px 360px at 50% -60px, rgba(120,140,190,0.16), transparent 72%)"></div>
<header style="position: relative; padding: 56px 20px 0"><h1 style="margin: 0; font-size: 34px; line-height: 41px; font-weight: 700; letter-spacing: -0.03em">Итоги</h1></header><div aria-hidden="true" style="position: absolute; inset: 0; z-index: 2; background: rgba(0,0,0,0.6)"></div>
<section role="dialog" aria-label="Заметка о неделе" style="position: absolute; left: 0; right: 0; bottom: 0; z-index: 3; padding: 10px 20px 50px; border-radius: 28px 28px 0 0; background: rgba(22,22,26,0.82); backdrop-filter: blur(30px) saturate(160%); -webkit-backdrop-filter: blur(30px) saturate(160%); border-top: 1px solid rgba(255,255,255,0.12); display: flex; flex-direction: column; gap: 16px">
<div aria-hidden="true" style="width: 36px; height: 5px; border-radius: 3px; background: rgba(255,255,255,0.25); margin: 0 auto 2px"></div>
<div><h2 style="margin: 0; font-size: 24px; line-height: 30px; font-weight: 700; letter-spacing: -0.02em">Как прошла неделя?</h2><p class="cap" style="margin: 4px 0 0; font-size: 15px">18–24 ноября</p></div>
<label for="note" style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">Заметка о неделе</label>
<textarea id="note" class="ta" style="min-height: 220px; font-size: 17px; line-height: 24px" placeholder="Например: получилось не пропустить английский. Тяжело было в среду — пары до вечера. Хочу ложиться до часа." value="{{text}}" onInput="{{onText}}"></textarea>
<button style="appearance: none; border: 0; font: inherit; height: 52px; border-radius: 16px; background: {{saveBg}}; color: {{saveFg}}; font-size: 17px; font-weight: 600; cursor: pointer">Сохранить</button>
</section>
<main style="position: relative; padding: 16px 16px 0; display: flex; flex-direction: column; gap: 12px">

</main>

<div data-nav="pill" style="position: absolute; left: 0; right: 0; bottom: 34px; display: flex; justify-content: center; align-items: center; gap: 10px">
<nav aria-label="Разделы" style="display: flex; align-items: center; gap: 6px; padding: 6px; border-radius: 999px; background: rgba(28,28,32,0.72); backdrop-filter: blur(24px) saturate(180%); -webkit-backdrop-filter: blur(24px) saturate(180%); border: 1px solid rgba(255,255,255,0.12); box-shadow: 0 8px 24px rgba(0,0,0,0.45)">
<a href="TodayGlass.dc.html" aria-label="Сегодня" style="width: 48px; height: 48px; border-radius: 50%; background: rgba(255,255,255,0.10); color: #f5f5f7; display: flex; align-items: center; justify-content: center; text-decoration: none"><svg viewBox="0 0 24 24" aria-hidden="true" style="width: 21px; height: 21px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round"><circle cx="12" cy="12" r="8.5"></circle><path d="M8.5 12.2l2.4 2.3 4.6-4.8"></path></svg></a>
<a href="PlanGlass.dc.html" aria-label="План" style="width: 48px; height: 48px; border-radius: 50%; background: rgba(255,255,255,0.10); color: #f5f5f7; display: flex; align-items: center; justify-content: center; text-decoration: none"><svg viewBox="0 0 24 24" aria-hidden="true" style="width: 21px; height: 21px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round"><circle cx="12" cy="12" r="8.5"></circle><circle cx="12" cy="12" r="4.5"></circle><circle cx="12" cy="12" r="0.8"></circle></svg></a>
<a href="ResultsGlass.dc.html" aria-current="page" style="height: 48px; padding: 0 20px 0 16px; border-radius: 999px; background: #f5f5f7; color: #000; display: flex; align-items: center; gap: 8px; text-decoration: none; font-size: 15px; font-weight: 600"><svg viewBox="0 0 24 24" aria-hidden="true" style="width: 21px; height: 21px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round"><path d="M5 20v-6M12 20V5M19 20v-10"></path></svg>Итоги</a>
</nav>
<a href="AddFullGlass.dc.html" aria-label="Добавить привычку или задачу" style="width: 60px; height: 60px; border-radius: 50%; background: rgba(28,28,32,0.72); backdrop-filter: blur(24px) saturate(180%); -webkit-backdrop-filter: blur(24px) saturate(180%); border: 1px solid rgba(255,255,255,0.12); box-shadow: 0 8px 24px rgba(0,0,0,0.45); display: flex; align-items: center; justify-content: center; text-decoration: none"><span style="width: 48px; height: 48px; border-radius: 50%; background: #f5f5f7; color: #000; display: flex; align-items: center; justify-content: center"><svg viewBox="0 0 24 24" aria-hidden="true" style="width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 2.2; stroke-linecap: round"><path d="M12 5v14M5 12h14"></path></svg></span></a>
</div>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(p) { super(p); this.state = { text: 'Получилось не пропустить английский и сдать лабу. Тяжело было в среду и пятницу: пары до вечера, про воду забывал. Хочу ложиться до часа.' }; }
  renderVals() {
    const any = this.state.text.trim().length > 0;
    return { text: this.state.text, onText: (e) => this.setState({ text: e.target.value }),
      saveBg: any ? '#f5f5f7' : 'rgba(255,255,255,0.10)', saveFg: any ? '#000' : '#636366' };
  }
}
</script>
</body>
</html>
