<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(p) { super(p); this.state = { b: 50, w: 490, drag: null, q: 2 }; }
  renderVals() {
    const C = 140, R = 106;
    const fmt = (m) => { m = ((m % 1440) + 1440) % 1440; return Math.floor(m / 60) + ':' + String(m % 60).padStart(2, '0'); };
    const pos = (m) => { const a = m / 1440 * 2 * Math.PI; return [C + R * Math.sin(a), C - R * Math.cos(a)]; };
    const b = this.state.b, w = this.state.w;
    const len = ((w - b) % 1440 + 1440) % 1440;
    const a0 = b / 1440 * 360, arc = len / 1440 * 360;
    const [bX, bY] = pos(b), [wX, wY] = pos(w);
    const ang = (e) => { const r = e.currentTarget.getBoundingClientRect(); const x = e.clientX - r.left - r.width / 2, y = e.clientY - r.top - r.height / 2; let a = Math.atan2(x, -y) / (2 * Math.PI); if (a < 0) a += 1; return Math.round(a * 1440 / 5) * 5 % 1440; };
    const qs = ['Плохо', 'Нормально', 'Хорошо'].map((t, i) => { const on = this.state.q === i; return { t, on, bg: on ? '#f5f5f7' : 'rgba(255,255,255,0.10)', fg: on ? '#000' : '#f5f5f7', tap: () => this.setState({ q: i }) }; });
    return {
      bT: fmt(b), wT: fmt(w), bX, bY, wX, wY, qs,
      dur: Math.floor(len / 60) + ' ч ' + (len % 60 ? (len % 60) + ' мин' : ''),
      arcBg: 'conic-gradient(from ' + a0 + 'deg, #5a2dff 0deg, #5a2dff ' + (arc * 0.8) + 'deg, #9a7dff ' + (arc * 0.92) + 'deg, #f0b97a ' + arc + 'deg, transparent ' + arc + 'deg)',
      bDown: (e) => { e.stopPropagation && e.stopPropagation(); this.setState({ drag: 'b' }); },
      wDown: (e) => { e.stopPropagation && e.stopPropagation(); this.setState({ drag: 'w' }); },
      move: (e) => { if (!this.state.drag) return; this.setState({ [this.state.drag]: ang(e) }); },
      up: () => { if (this.state.drag) this.setState({ drag: null }); }
    };
  }
}
