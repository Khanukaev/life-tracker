<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Строка дела</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&amp;display=swap">
<style>body{margin:0}</style>
</helmet>
<div style="width: 100%; min-height: 56px; box-sizing: border-box; display: flex; align-items: center; gap: 4px; padding: 6px 16px 6px 6px; font-family: Geist, -apple-system, system-ui, sans-serif; color: #f5f5f7; letter-spacing: -0.01em; border-top: {{border}}">
<sc-if value="{{tappable}}" hint-placeholder-val="{{ true }}">
<button onClick="{{tap}}" aria-label="{{label}}" style="appearance: none; border: 0; background: transparent; padding: 0; width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; cursor: pointer; flex: none">
<span style="width: 26px; height: 26px; border-radius: 50%; background: {{fill}}; box-shadow: {{ring}}; display: flex; align-items: center; justify-content: center"><svg viewBox="0 0 24 24" aria-hidden="true" style="width: 16px; height: 16px; fill: none; stroke: #000; stroke-width: 2.6; stroke-linecap: round; stroke-linejoin: round"><path d="{{checkD}}"></path></svg></span>
</button>
</sc-if>
<sc-if value="{{autoRes}}" hint-placeholder-val="{{ false }}">
<span role="img" aria-label="{{resLabel}}" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; flex: none">
<span style="width: 26px; height: 26px; border-radius: 50%; background: {{fill}}; box-shadow: {{ring}}; display: flex; align-items: center; justify-content: center"><svg viewBox="0 0 24 24" aria-hidden="true" style="width: 16px; height: 16px; fill: none; stroke: #000; stroke-width: 2.6; stroke-linecap: round; stroke-linejoin: round"><path d="{{checkD}}"></path></svg></span>
</span>
</sc-if>
<sc-if value="{{auto}}" hint-placeholder-val="{{ false }}">
<span role="img" aria-label="Отмечается само по сну" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; flex: none; color: #8e8e93">
<svg viewBox="0 0 26 26" aria-hidden="true" style="width: 26px; height: 26px; fill: none; stroke: currentColor; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round"><circle cx="13" cy="13" r="12" stroke-dasharray="3 3"></circle><path transform="translate(0.94 -1.14)" d="M17 15.2A5 5 0 1 1 11 9.2a4 4 0 0 0 6 6z"></path></svg>
</span>
</sc-if>
<a href="{{href}}" style="flex: 1; min-width: 0; min-height: 44px; display: flex; flex-direction: column; justify-content: center; gap: 2px; text-decoration: none; color: inherit">
<span style="font-size: 16px; line-height: 21px; color: {{titleColor}}; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{title}}</span>
<span style="display: flex; align-items: center; gap: 6px; font-size: 13px; line-height: 18px; color: {{metaColor}}; white-space: nowrap; overflow: hidden">
<sc-if value="{{regular}}" hint-placeholder-val="{{ false }}"><svg viewBox="0 0 16 16" role="img" aria-label="Регулярное" style="width: 13px; height: 13px; flex: none; fill: none; stroke: currentColor; stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round"><path d="M13 6.5A5.2 5.2 0 0 0 3.3 5M3 9.5A5.2 5.2 0 0 0 12.7 11M3.2 2.6V5h2.4M12.8 13.4V11h-2.4"></path></svg></sc-if>
<span style="font-variant-numeric: tabular-nums; overflow: hidden; text-overflow: ellipsis">{{meta}}</span>
<sc-if value="{{hasGoal}}" hint-placeholder-val="{{ false }}"><span style="display: inline-flex; align-items: center; gap: 4px; height: 20px; padding: 0 8px; border-radius: 999px; background: rgba(255,255,255,0.10); color: #d1d1d6; font-size: 12px; flex: none; outline: {{goalOutline}}; outline-offset: 1px">{{goal}}</span></sc-if>
</span>
</a>
<sc-if value="{{hasRight}}" hint-placeholder-val="{{ false }}"><span style="font-variant-numeric: tabular-nums; font-size: 15px; font-weight: {{rightWeight}}; color: {{rightColor}}; flex: none">{{right}}</span></sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"item":{"editor":null,"tsType":"object"},"first":{"editor":"boolean","default":true},"$preview":{"width":390,"height":64}}'>
class Component extends DCLogic {
  constructor(p) {
    super(p);
    const it = (p && p.item) || {};
    this.state = { step: it.step || 0 };
  }
  renderVals() {
    const it = this.props.item || { kind: 'check', title: 'Зарядка 10 минут', meta: 'каждый день', regular: true };
    const kind = it.kind || 'check';
    const total = kind === 'count' ? (it.total || 1) : 1;
    const step = Math.min(this.state.step, total);
    const res = kind === 'auto' ? it.result : null;
    const done = kind === 'auto' ? res === 'done' : step >= total;
    const alert = !!(it.alert || it.crit) && !done;
    let meta = it.meta || '';
    if (kind === 'count') meta = (step * (it.per || 1)) + ' из ' + (total * (it.per || 1)) + ' ' + (it.unit || '');
    return {
      title: it.title,
      meta: meta,
      href: it.regular ? 'HabitDetailGlass.dc.html' : 'TaskDetailGlass.dc.html',
      regular: !!it.regular,
      hasGoal: !!it.goal,
      goal: it.goal || '',
      goalOutline: it.todo ? '1.5px dashed #2f56b0' : 'none',
      hasRight: !!it.right,
      right: it.right || '',
      rightColor: done ? '#8e8e93' : (alert ? '#ff453a' : (it.crit ? '#f5f5f7' : '#aeaeb2')),
      metaColor: alert ? '#ff6961' : '#8e8e93',
      rightWeight: it.crit && !done ? 600 : 400,
      tappable: kind !== 'auto',
      auto: kind === 'auto' && !res,
      autoRes: kind === 'auto' && !!res,
      resLabel: res === 'done' ? 'Выполнено по сну' : 'Не выполнено по сну',
      label: (done ? 'Снять отметку: ' : (kind === 'count' ? 'Плюс один: ' : 'Отметить: ')) + it.title,
      fill: done ? '#69ff79' : 'transparent',
      ring: done ? 'none' : (alert ? 'inset 0 0 0 2px #ff453a, 0 0 10px rgba(255,69,58,0.35)' : (res === 'miss' ? 'inset 0 0 0 1.6px #48484a' : 'inset 0 0 0 1.6px #636366')),
      checkD: done ? 'M6 12.5l4 3.8 8-8.3' : '',
      titleColor: done ? '#8e8e93' : '#f5f5f7',
      border: (this.props.first ?? true) ? 'none' : '1px solid rgba(255,255,255,0.09)',
      tap: () => this.setState({ step: this.state.step >= total ? 0 : this.state.step + 1 })
    };
  }
}
</script>
</body>
</html>
